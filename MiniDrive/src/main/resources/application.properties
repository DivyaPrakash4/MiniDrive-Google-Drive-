spring.application.name=MiniDrive

# Server Port
server.port=${PORT:8080}

# ========================================================
# Database Configuration (MySQL / AWS RDS)
# ========================================================
# Default: Localhost MySQL
# AWS RDS: Set DB_URL, DB_USERNAME, DB_PASSWORD environment variables
# Example RDS URL: jdbc:mysql://minidrive-db.xxxxxx.ap-south-1.rds.amazonaws.com:3306/minidrive_db
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minidrive_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ========================================================
# AWS S3 Configuration
# ========================================================
# On AWS EC2 with an attached IAM Role:
# - Leave aws.access-key and aws.secret-key empty!
# - The AWS SDK will automatically fetch temporary credentials from IAM.
#
# For Local Testing (if not using AWS CLI or IAM):
# - Fill in your AWS IAM user access-key and secret-key below.
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET:minidrive-divya}
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}

# File Size Limits (AWS Free Tier safe)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
